providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "glib", "nss", "freetype", "harfbuzz", "ca-certificates", "ttf-freefont"]

[phases.install]
cmds = ["cd nextjs_space && npm install"]

[phases.build]
cmds = ["cd nextjs_space && npx prisma generate", "cd nextjs_space && npm run build"]

[start]
cmd = "cd nextjs_space && npx prisma db push && npm run start"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
